<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapes, Colours and Sorting Garden — an activity for three-year-olds</title>
<meta name="description" content="Three short activities for a child of about three: match the same shape, sort shapes into meadows and count toys up to three. No reading needed, no ads and no data collected.">
</head>
<body>
<div id="app-root"></div>
<style>
/* ===========================================================================
 * Shapes, Colours and Sorting Garden — presentation.
 * Part 1: tokens, reset, shell, accessibility, responsive rules.
 * No external fonts, images or network requests: all the artwork is SVG.
 * =========================================================================== */
:root{
  --ink:#152B36;
  --ink-soft:#3D5566;
  --sky:#E9F1F7;
  --sky-deep:#D3E4F0;
  --card:#FFFFFF;
  --cream:#FFF8EE;
  --line:#C7D9E5;
  --focus:#0B4C8C;

  --dot:#C8382B;
  --dot-ink:#8C1F16;
  --dot-tint:#F6DFDB;
  --stripe:#1B5FA8;
  --stripe-ink:#12406F;
  --stripe-tint:#DBE6F3;
  --cross:#A87D00;
  --cross-ink:#6A5000;
  --cross-tint:#F8EDD0;
  --neutral:#8FA08C;
  --neutral-ink:#3B4638;

  --good:#146B3A;
  --good-tint:#DBF0DF;
  --care:#8A5312;
  --care-tint:#FBEBD3;

  --r-lg:28px;
  --r-md:20px;
  --r-sm:14px;
  --shadow:0 4px 0 rgba(18,48,64,.18), 0 10px 24px rgba(18,48,64,.10);
  --shadow-soft:0 2px 0 rgba(18,48,64,.12), 0 6px 16px rgba(18,48,64,.08);
  --tap:96px;
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  font-family:"Segoe UI",Verdana,Geneva,Tahoma,"Trebuchet MS",sans-serif;
  font-size:19px;
  line-height:1.55;
  color:var(--ink);
  background:
    radial-gradient(1100px 380px at 12% -8%, #FFF6E6 0%, rgba(255,246,230,0) 62%),
    radial-gradient(900px 420px at 96% 4%, #E2F1E6 0%, rgba(226,241,230,0) 58%),
    var(--sky);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
}

h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h1{font-size:1.7rem;letter-spacing:.2px}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0 0 .9em}
a{color:#0B4C8C}

/* For screen readers only, but not "display:none" */
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.skip-link{
  position:absolute;left:12px;top:-120px;z-index:60;
  background:#FFFFFF;color:var(--ink);padding:14px 20px;border-radius:var(--r-sm);
  border:3px solid var(--focus);font-weight:700;text-decoration:none;
  transition:top .15s ease;
}
.skip-link:focus{top:12px}

/* A visible focus ring on everything that can be pressed */
:focus{outline:none}
:focus-visible{
  outline:5px solid var(--focus);
  outline-offset:3px;
  border-radius:10px;
}
.btn:focus-visible,.tile:focus-visible,.choice:focus-visible,.bin:focus-visible,
.arrow-btn:focus-visible,.num-btn:focus-visible,.icon-btn:focus-visible{
  outline:5px solid var(--focus);
  outline-offset:4px;
}

.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.stack>*+*{margin-top:14px}

/* ---------------------------------------------------------------- header --- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);
}
.topbar-in{
  max-width:1140px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;margin-right:auto}
.brand-mark{width:40px;height:40px;flex:0 0 40px}
.brand-sub{display:block;font-weight:600;font-size:.82rem;color:var(--ink-soft);line-height:1.2}

.icon-btn{
  min-height:56px;min-width:56px;padding:8px 16px;
  display:inline-flex;align-items:center;gap:9px;justify-content:center;
  font:inherit;font-weight:700;color:var(--ink);
  background:var(--cream);border:3px solid var(--ink);border-radius:var(--r-md);
  cursor:pointer;
}
.icon-btn:hover{background:#FFF1D8}
.icon-btn[aria-pressed="true"]{background:var(--sky-deep)}

/* ---------------------------------------------------------------- buttons --- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:var(--tap);padding:16px 26px;
  font:inherit;font-size:1.1rem;font-weight:800;letter-spacing:.2px;
  color:#FFFFFF;background:var(--stripe);
  border:3px solid var(--ink);border-radius:var(--r-md);
  box-shadow:var(--shadow);cursor:pointer;text-align:center;
  text-decoration:none;
}
.btn:hover{background:#155099}
.btn:active{transform:translateY(2px);box-shadow:var(--shadow-soft)}
.btn.btn-plain{background:var(--card);color:var(--ink)}
.btn.btn-plain:hover{background:#F1F7FB}
.btn.btn-warm{background:var(--dot)}
.btn.btn-warm:hover{background:#A82C21}
.btn.btn-leaf{background:var(--good)}
.btn.btn-leaf:hover{background:#0F5530}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.6;cursor:default;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* ------------------------------------------------------------- cards --- */
.card{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow);
}
.card-soft{
  background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow-soft);
}

/* ------------------------------------------------------------- status --- */
.status{
  border:3px solid var(--line);border-left-width:12px;border-radius:var(--r-md);
  background:var(--card);padding:14px 18px;font-weight:700;font-size:1.1rem;
  min-height:74px;display:flex;align-items:center;gap:12px;
}
.status.is-idle{border-left-color:var(--line)}
.status.is-good{border-left-color:var(--good);background:var(--good-tint)}
.status.is-care{border-left-color:var(--care);background:var(--care-tint)}
.status .status-icon{flex:0 0 auto;width:44px;height:44px}

.chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--sky-deep);border:2px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-weight:700;font-size:.95rem;
}

/* The "what to do" coach panel — big, but not pushy */
.coach{
  display:flex;gap:12px;align-items:flex-start;
  background:#FFF6E0;border:2px dashed var(--cross-ink);border-radius:var(--r-md);
  padding:12px 16px;font-size:1rem;
}
.coach strong{color:#5A4300}

/* ------------------------------------------------------------ footer/small print --- */
.foot-note{color:var(--ink-soft);font-size:.95rem}

/* --------------------------------------------------------- animation (UX) --- */
@keyframes pop-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes gentle-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes halo{0%,100%{opacity:.55}50%{opacity:1}}
.pop-in{animation:pop-in .28s ease-out both}
.bounce-once{animation:gentle-bounce .6s ease-in-out 1}

/* Full respect for prefers-reduced-motion: not one required animation */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ----------------------------------------------------------------- responsive --- */
@media (max-width:520px){
  :root{--tap:88px}
  body{font-size:18px}
  h1{font-size:1.4rem}
  .card{padding:16px;border-radius:var(--r-md)}
  .card-soft{padding:16px;border-radius:var(--r-md)}
  .topbar-in{padding:8px 12px;gap:8px}
  .brand{font-size:.98rem}
  .brand-mark{width:34px;height:34px;flex-basis:34px}
  .icon-btn{min-height:56px;padding:6px 12px;font-size:.95rem}
  .btn{width:100%;padding:14px 18px}
  .btn-row{gap:10px}
  .wrap{padding:0 12px}
}
@media (min-width:768px){
  body{font-size:20px}
}
@media (min-width:1280px){
  .wrap{max-width:1180px;padding:0 24px}
}
</style>
<style>
/* ===========================================================================
 * Part 2: activity screens, activity elements, the grown-up section, print.
 * =========================================================================== */

/* ------------------------------------------------------------- activities --- */
.activity-head{margin-bottom:14px}
.activity-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.activity-title h1{margin:0}
.activity-title .step-chip{
  background:var(--cream);border:2px solid var(--ink);border-radius:999px;
  padding:5px 14px;font-size:.9rem;font-weight:800;
}

.stage{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow);margin-bottom:16px;
}

/* The task model */
.target{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--cream);border:3px dashed var(--ink);border-radius:var(--r-md);
  padding:14px 18px;
}
.target-body{display:flex;flex-direction:column;align-items:center;gap:4px}
.target-caption{font-size:.95rem;font-weight:700;color:var(--ink-soft)}

/* The row of answer choices: 2–3 large tiles */
.choices{
  display:grid;gap:16px;margin-top:16px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
}
.choices[data-count="2"]{grid-template-columns:repeat(2,minmax(140px,1fr))}
.choices[data-count="3"]{grid-template-columns:repeat(3,minmax(120px,1fr))}
@media (max-width:520px){
  .choices,.choices[data-count="2"],.choices[data-count="3"]{grid-template-columns:1fr;gap:12px}
}

.choice{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);
  padding:16px 12px 14px;
  font:inherit;font-weight:800;color:var(--ink);
  background:var(--cream);
  border:4px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--shadow);cursor:pointer;
}
.choice:hover{background:#FFF1D8}
.choice:active{transform:translateY(2px);box-shadow:var(--shadow-soft)}
.choice .shape-svg{display:block;height:auto;max-width:100%}
.choice-name{font-size:1.02rem;text-align:center}
.choice.is-correct{background:var(--good-tint);border-color:var(--good)}
.choice.is-wrong{background:var(--care-tint);border-color:var(--care)}
.choice.is-hinted{background:#FFF3CF;border-color:var(--dot-ink)}
.choice.is-locked{cursor:default;opacity:.85}
.choice[aria-disabled="true"]{cursor:default}

/* Choice numbers: a label that tells the buttons apart without colour */
.tile-index{
  position:absolute;top:8px;left:8px;
  min-width:34px;height:34px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--ink);color:#FFFFFF;border-radius:999px;
  font-size:.95rem;font-weight:800;
}
.swatch-label{
  display:inline-block;font-size:.98rem;font-weight:800;color:var(--ink);
  background:#FFFFFF;border:2px solid var(--line);border-radius:999px;
  padding:2px 12px;margin-top:4px;
}

/* The "show me" demonstration */
.demo-ghost{
  position:relative;
}
.demo-ghost::after{
  content:"";position:absolute;inset:-10px;border-radius:inherit;
  border:4px dashed var(--cross-ink);pointer-events:none;
}
.demo-note{
  display:inline-flex;align-items:center;gap:10px;
  background:#FFF6E0;border:2px solid var(--cross-ink);border-radius:999px;
  padding:6px 14px;font-weight:800;font-size:.95rem;color:#5A4300;
}

/* -------------------------------------------------- sorting into meadows --- */
.sort-layout{display:grid;gap:18px}
@media (min-width:768px){
  .sort-layout{grid-template-columns:1fr;gap:22px}
}

.tray{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  background:#F3F8FB;border:3px solid var(--line);border-radius:var(--r-md);
  padding:14px;min-height:110px;
}
.tray-empty{
  font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;gap:10px;
}
.tray-title{font-weight:800;margin:0 0 8px;font-size:1rem}

.bins{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media (max-width:520px){.bins{grid-template-columns:1fr}}

.bin{
  display:flex;flex-direction:column;gap:8px;
  padding:14px;font:inherit;text-align:left;color:var(--ink);
  background:var(--card);
  border:4px dashed var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--shadow-soft);cursor:pointer;min-height:var(--tap);
}
.bin:hover{background:#F7FBFD}
.bin.is-good{border-style:solid;border-color:var(--good);background:var(--good-tint)}
.bin.is-care{border-color:var(--care);background:var(--care-tint)}
.bin-head{display:flex;align-items:center;gap:12px}
.bin-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.bin-caption{font-size:1rem;font-weight:800;line-height:1.25}
.bin-count{font-size:.88rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.bin-slot{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  min-height:64px;background:#F3F8FB;border-radius:var(--r-sm);padding:8px;
}

/* A piece in the tray or in a meadow */
.piece{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:0;font:inherit;cursor:pointer;
  border-radius:var(--r-md);
}
.piece[aria-disabled="true"]{cursor:default}
.piece:focus-visible{outline:5px solid var(--focus);outline-offset:4px}
.piece.is-selected{transform:translateY(-4px)}
.piece-placed{cursor:default}
.piece-name{font-size:.85rem;font-weight:700;color:var(--ink-soft)}

/* The extra sorting meadows — large touch targets */
.bins-inline{display:grid;gap:14px;margin-top:12px}
@media (min-width:640px){.bins-inline{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}

/* --------------------------------------------------------------- counting --- */
.shelf{
  display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap;
  min-height:190px;padding:18px;
  background:linear-gradient(#FFFDF7,#F1F7FB);
  border:3px solid var(--ink);border-radius:var(--r-lg);
}
.slot{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  width:110px;min-height:150px;justify-content:flex-end;
}
@media (max-width:520px){
  /* On a narrow screen the shelf is lower, so the counting button and the numbers are visible at once. */
  .shelf{min-height:132px;padding:10px 6px;gap:8px}
  .slot{width:76px;min-height:104px}
  .slot-halo{width:76px;height:76px}
  .number-tag{min-width:44px;height:44px;font-size:1.25rem}
  .toy{width:64px;height:64px}
}

.number-tag{
  min-width:52px;height:52px;padding:0 10px;
  display:none;align-items:center;justify-content:center;
  background:var(--stripe);color:#FFFFFF;border:3px solid var(--ink);border-radius:999px;
  font-size:1.5rem;font-weight:900;
}
.slot.is-counted .number-tag{display:inline-flex}
.slot.is-counted .toy{filter:drop-shadow(0 0 0 #FFF)}
.toy{display:block}
.toy-hidden{visibility:hidden}
@keyframes halo{
  0%,100%{opacity:.35;transform:scale(1)}
  50%{opacity:.9;transform:scale(1.06)}
}
.slot.is-active .slot-halo{animation:halo .9s ease-in-out infinite}
.slot-halo{
  position:absolute;inset:auto;width:0;height:0;
}
.slot{position:relative}
.slot-halo{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle,#FFE9A8 0%,rgba(255,233,168,0) 70%);
  opacity:0;pointer-events:none;
}
.slot.is-counted .slot-halo{opacity:.5;animation:none}
.slot.is-active .slot-halo{opacity:.9}

.counter-panel{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  justify-content:space-between;margin-top:16px;
  background:var(--cream);border:3px dashed var(--ink);border-radius:var(--r-md);
  padding:12px 16px;
}
.arrow-btn{
  display:inline-flex;align-items:center;gap:10px;
  min-height:var(--tap);padding:12px 24px;
  font:inherit;font-size:1.1rem;font-weight:800;
  color:#FFFFFF;background:var(--good);
  border:3px solid var(--ink);border-radius:var(--r-md);
  box-shadow:var(--shadow);cursor:pointer;
}
.arrow-btn:hover{background:#0F5530}
.arrow-btn[aria-disabled="true"]{opacity:.55;cursor:default;box-shadow:none}

.num-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.num-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:104px;min-height:var(--tap);padding:10px 14px;
  font:inherit;font-weight:800;color:var(--ink);
  background:var(--card);border:4px solid var(--ink);border-radius:var(--r-md);
  box-shadow:var(--shadow);cursor:pointer;
}
.num-btn:hover{background:#F1F7FB}
.num-btn.is-correct{background:var(--good-tint);border-color:var(--good)}
.num-btn.is-wrong{background:var(--care-tint);border-color:var(--care)}
.num-btn[aria-disabled="true"]{opacity:.6;cursor:default}
.numeral-svg{display:block}

.toy-picker{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.toy-picker .btn{min-height:80px;padding:12px 20px}

/* --------------------------------------------------------- completion --- */
.done-hero{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--good-tint);border:3px solid var(--good);border-radius:var(--r-lg);
  padding:18px;
}
.done-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.done-list li{display:flex;align-items:center;gap:12px;font-weight:700}
.done-tick{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--good);color:#FFFFFF;font-size:1.2rem;font-weight:900;
}
.done-tick.is-off{background:#E7EEF3;color:#3D5566;border:2px solid var(--line)}

/* ------------------------------------------------------ grown-up section --- */
.grownup{border:3px solid var(--stripe);border-radius:var(--r-lg);background:var(--card);
  padding:20px;box-shadow:var(--shadow);margin-top:22px}
.grownup h2{margin-top:0}
.facts{display:grid;gap:14px}
@media (min-width:768px){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{background:#F7FBFD;border:2px solid var(--line);border-radius:var(--r-md);padding:14px}
.fact h3{margin-top:0;font-size:1rem}
.fact ul{margin:0;padding-left:20px}
.fact li{margin-bottom:6px}

/* ------------------------------------------------------------- print --- */
@media print{
  body{background:#FFF}
  .topbar,.no-print{display:none!important}
  .card,.card-soft,.stage{box-shadow:none}
}
</style>

    yellow: {
      id: 'yellow',
      label: 'yellow',
      hex: '#A87D00',
      pattern: 'crosshatch',
      patternStroke: '#241A00',
      patternFill: 'none'
    }
  };

  var COLOR_IDS = ['red', 'blue', 'yellow'];

  /* Sorting by colour uses three different silhouettes as an extra cue, so a
     child who cannot yet separate red from blue can still sort correctly and
     still succeed. The sorting-by-shape round then strips colour away. */
  var COLOR_GROUP_SHAPE = { red: 'circle', blue: 'square', yellow: 'triangle' };

  /* =====================================================================
   * 3. Activities — demonstration → guided practice → fresh application.
   *    The demonstration turn (demo: true) is played by the app itself and
   *    can be replayed at any time; the learner is never asked to guess
   *    before seeing it once.
   * ===================================================================== */

  /* Activity 1 — Shapes. Identical match first, then size, then rotation,
     then a fresh arrangement. Shape identity never changes with size or
     rotation, which is the point of the last two rounds. */
  function shapeRounds() {
    return [
      {
        id: 's0',
        demo: true,
        prompt: 'Tap the same circle',
        target: { shape: 'circle', color: 'red', pattern: 'dots' },
        choices: [
          { shape: 'circle', color: 'red', pattern: 'dots', ok: true },
          { shape: 'square', color: 'blue' }
        ]
      },
      {
        id: 's1',
        demo: false,
        prompt: 'Tap the same square',
        target: { shape: 'square', color: 'blue', pattern: 'stripes' },
        choices: [
          { shape: 'triangle', color: 'yellow' },
          { shape: 'square', color: 'blue', pattern: 'stripes', ok: true }
        ]
      },
      {
        id: 's2',
        demo: false,
        prompt: 'Tap the same triangle',
        target: { shape: 'triangle', color: 'yellow', pattern: 'crosshatch' },
        choices: [
          { shape: 'triangle', color: 'yellow', pattern: 'crosshatch', ok: true },
          { shape: 'circle', color: 'red' }
        ]
      },
      {
        id: 's3',
        demo: false,
        prompt: 'The same square, only small',
        target: { shape: 'square', color: 'blue', pattern: 'stripes' },
        choices: [
          { shape: 'triangle', color: 'yellow', size: 0.8 },
          { shape: 'square', color: 'blue', pattern: 'stripes', size: 0.5, ok: true }
        ]
      },
      {
        id: 's4',
        demo: false,
        prompt: 'The same triangle, only turned',
        target: { shape: 'triangle', color: 'yellow', pattern: 'crosshatch' },
        choices: [
          { shape: 'triangle', color: 'yellow', pattern: 'crosshatch', rotate: 30, ok: true },
          { shape: 'circle', color: 'red', size: 0.8 }
        ]
      },
      {
        id: 's5',
        demo: false,
        prompt: 'New: a small turned circle',
        target: { shape: 'circle', color: 'red', pattern: 'dots' },
        choices: [
          { shape: 'circle', color: 'red', pattern: 'dots', size: 0.7, rotate: -20, ok: true },
          { shape: 'square', color: 'blue', pattern: 'stripes' }
        ]
      }
    ];
  }

  /* Activity 2 — Sorting by ONE visible property. Colour round first: the
     groups differ by silhouette, pattern and written label as well as by
     colour, so success never depends on colour vision. The shape round is
     the fresh application: same gesture, new property, no colour cue at all
     (every item is painted the same neutral colour). */
  function sortingRounds() {
    return [
      {
        id: 'c1',
        mode: 'color',
        demo: true,
        prompt: 'Sort by colour: each meadow has its own pattern and its own shape',
        groups: [
          { key: 'red', color: 'red', shape: 'circle', label: 'Red — round, with dots' },
          { key: 'blue', color: 'blue', shape: 'square', label: 'Blue — square, with stripes' },
          { key: 'yellow', color: 'yellow', shape: 'triangle', label: 'Yellow — triangle, with a grid' }
        ],
        items: [
          { id: 'p1', color: 'red', shape: 'circle', group: 'red', demo: true },
          { id: 'p2', color: 'blue', shape: 'square', group: 'blue' },
          { id: 'p3', color: 'yellow', shape: 'triangle', group: 'yellow' },
          { id: 'p4', color: 'blue', shape: 'square', group: 'blue' },
          { id: 'p5', color: 'red', shape: 'circle', group: 'red' },
          { id: 'p6', color: 'yellow', shape: 'triangle', group: 'yellow' }
        ]
      },
      {
        id: 'c2',
        mode: 'color',
        demo: false,
        prompt: 'Once more, a little different: sort by colour',
        groups: [
          { key: 'red', color: 'red', shape: 'triangle', label: 'Red — triangle, with dots' },
          { key: 'blue', color: 'blue', shape: 'circle', label: 'Blue — round, with stripes' }
        ],
        items: [
          { id: 'q1', color: 'blue', shape: 'circle', group: 'blue' },
          { id: 'q2', color: 'red', shape: 'triangle', group: 'red' },
          { id: 'q3', color: 'red', shape: 'triangle', group: 'red' },
          { id: 'q4', color: 'blue', shape: 'circle', group: 'blue' }
        ]
      },
      {
        id: 'c3',
        mode: 'shape',
        demo: true,
        prompt: 'Now by shape. Shape matters more than colour — all the shapes are the same colour',
        groups: [
          { key: 'circle', shape: 'circle', label: 'All the circles', neutral: true },
          { key: 'square', shape: 'square', label: 'All the squares', neutral: true },
          { key: 'triangle', shape: 'triangle', label: 'All the triangles', neutral: true }
        ],
        items: [
          { id: 'r1', shape: 'circle', color: 'neutral', group: 'circle', demo: true },
          { id: 'r2', shape: 'square', color: 'neutral', group: 'square' },
          { id: 'r3', shape: 'triangle', color: 'neutral', group: 'triangle' },
          { id: 'r4', shape: 'square', color: 'neutral', group: 'square' },
          { id: 'r5', shape: 'circle', color: 'neutral', group: 'circle' },
          { id: 'r6', shape: 'triangle', color: 'neutral', group: 'triangle' }
        ]
      }
    ];
  }

  /* Activity 3 — Counting a tiny collection, 1..3, revealed and highlighted
     one object at a time. The last reveal is the answer the child commits to
     by pressing the matching number. */
  var COUNT_STEPS = 3;

  var COUNT_ROUNDS = [
    {
      id: 'n1',
      demo: true,
      count: 3,
      prompt: 'Let us count together: tap the arrow button'
    },
    {
      id: 'n2',
      demo: false,
      count: 2,
      prompt: 'How many now? Count first, then pick the number'
    },
    {
      id: 'n3',
      demo: false,
      count: 3,
      prompt: 'New: three toys in a different order. Count and pick the number'
    },
    {
      id: 'n4',
      demo: false,
      count: 1,
      prompt: 'What if there is only one toy? Count and pick the number'
    }
  ];

  /* Neutral colour used in the sorting-by-shape round (the point is that
     colour carries no information there). */
  var NEUTRAL = {
    id: 'neutral',
    label: 'grey-green',
    hex: '#8FA08C',
    pattern: 'none',
    patternStroke: '#3B4638',
    patternFill: 'none'
  };

  function colorOf(id) {
    if (id === 'neutral') { return NEUTRAL; }
    return COLORS[id] || NEUTRAL;
  }

  function shapeOf(id) {
    return SHAPES[id] || SHAPES.circle;
  }

  /* =====================================================================
   * 4. Pure state logic — everything the automated tests exercise.
   * ===================================================================== */

  /**
   * A collection may hold at most three objects and always holds at least
   * one. Used by add/remove buttons and by the round definitions.
   */
  function clampCount(n) {
    n = Math.round(Number(n));
    if (!isFinite(n)) { return 1; }
    if (n < 1) { return 1; }
    if (n > COUNT_STEPS) { return COUNT_STEPS; }
    return n;
  }

  /**
   * Counting model.
   *
   * The log used by the acceptance test is `highlights`: one entry per object
   * that has been highlighted, taken in the order the child counted. The
   * invariant the brief asks for ("counting three objects highlights exactly
   * three objects once each") is therefore:
   *     sequence.length === 3, unique(sequence) === sequence, log.length === 3
   *
   * createCountState(3) -> sequence [0,1,2], empty log, count 0.
   * Each tap() appends exactly one entry. The log never repeats an index
   * because tap() refuses to advance past the end.
   */
  function createCountState(total) {
    var n = clampCount(total);
    var sequence = [];
    for (var i = 0; i < n; i++) { sequence.push(i); }
    return {
      total: n,
      sequence: sequence,
      count: 0,
      highlights: [],
      revealed: 0,
      finished: false,
      lastTapped: -1
    };
  }

  /** One child press: reveal and highlight the next object, exactly once. */
  function tapCount(state) {
    if (!state || state.finished) { return state; }
    var idx = state.sequence[state.count];
    if (typeof idx !== 'number') {
      state.finished = true;
      return state;
    }
    state.count = state.count + 1;
    state.revealed = state.count;
    state.highlights = state.highlights.concat([idx]);
    state.lastTapped = idx;
    if (state.count >= state.sequence.length) { state.finished = true; }
    return state;
  }

  function resetCountState(state) {
    if (!state) { return createCountState(COUNT_STEPS); }
    state.count = 0;
    state.revealed = 0;
    state.highlights = [];
    state.finished = false;
    state.lastTapped = -1;
    return state;
  }

  function isCountComplete(state) {
    return !!(state && state.count >= state.sequence.length && state.sequence.length > 0);
  }

  /**
   * Evidence for the acceptance example: exactly one highlight per object.
   * Returns structure, never throws, so the UI can ask "may I say done?".
   */
  function highlightAudit(state) {
    var seq = (state && state.sequence) || [];
    var log = (state && state.highlights) || [];
    var uniq = unique(log);
    return {
      expected: seq.length,
      highlighted: log.length,
      unique: uniq.length,
      onceEach: uniq.length === log.length && log.length === seq.length && sameSet(log, seq),
      missing: seq.filter(function (i) { return log.indexOf(i) === -1; }),
      repeated: uniq.filter(function (i) { return log.indexOf(i) !== uniq.lastIndexOf(i); })
    };
  }

  /**
   * Sorting model. Checkable without touching the DOM: place() returns the
   * outcome a renderer should show, and the outcome text names the property
   * so feedback is specific rather than a generic buzz.
   */
  function groupOf(item, mode) {
    if (!item) { return null; }
    return mode === 'shape' ? item.shape : item.color;
  }

  function createSortState(round) {
    var items = (round && round.items) || [];
    var placed = {};
    items.forEach(function (it) { placed[it.id] = null; });
    return {
      id: (round && round.id) || 'sort',
      mode: (round && round.mode) || 'color',
      groups: (round && round.groups) || [],
      items: items,
      placed: placed,
      remaining: items.length,
      mistakes: 0,
      lastResult: null
    };
  }

  /** Text used for the immediate response — always names the property. */
  function describeItem(item) {
    if (!item) { return 'shape'; }
    if (item.color === 'neutral') { return shapeOf(item.shape).label; }
    return colorOf(item.color).label + ' ' + shapeOf(item.shape).label;
  }

  function expectedGroupLabel(round, item) {
    var key = groupOf(item, round.mode);
    var g = (round.groups || []).filter(function (gr) { return gr.key === key; })[0];
    if (g) { return g.label; }
    return key;
  }

  /**
   * One child press: try to drop `itemId` into `groupKey`.
   * Returns {ok, groupKey, message, progress, complete} and mutates state.
   * A wrong press is an ordinary outcome: the item stays available, the
   * mistake counter is only used by the app to decide when to add a stronger
   * scaffold — it is never shown as a score to the child.
   */
  function place(state, itemId, groupKey) {
    var item = (state.items || []).filter(function (it) { return it.id === itemId; })[0];
    if (!item) {
      return { ok: false, unknownItem: true, message: 'This shape is already placed. Take another one.', progress: sortProgress(state) };
    }
    if (state.placed[itemId]) {
      return { ok: false, alreadyPlaced: true, message: 'This shape is already in the meadow "' + state.placed[itemId] + '".', progress: sortProgress(state) };
    }
    var expected = groupOf(item, state.mode);
    var ok = expected === groupKey;
    var progress = sortProgress(state);
    var res;
    if (ok) {
      state.placed[itemId] = groupKey;
      state.remaining = state.remaining - 1;
      state.lastResult = { itemId: itemId, ok: true, groupKey: groupKey };
      res = {
        ok: true,
        groupKey: groupKey,
        message: describeItem(item) + ' — in the meadow "' + expectedGroupLabel({ mode: state.mode, groups: state.groups }, item) + '".',
        progress: sortProgress(state),
        complete: state.remaining <= 0
      };
    } else {
      state.mistakes = state.mistakes + 1;
      state.lastResult = { itemId: itemId, ok: false, groupKey: groupKey };
      res = {
        ok: false,
        groupKey: groupKey,
        hint: describeItem(item) + ' — that is ' + (state.mode === 'shape' ? 'not the same shape' : 'a different colour') + '. Try another meadow.',
        message: 'Look: ' + describeItem(item) + ' belongs in "' + expectedGroupLabel({ mode: state.mode, groups: state.groups }, item) + '".',
        progress: sortProgress(state),
        complete: false
      };
    }
    progress = sortProgress(state);
    res.progress = progress;
    return res;
  }

  function sortProgress(state) {
    var items = (state && state.items) || [];
    var placedList = items.filter(function (it) { return state.placed[it.id]; });
    return {
      placed: placedList.length,
      total: items.length,
      remaining: items.filter(function (it) { return !state.placed[it.id]; }).length,
      mistakes: state.mistakes || 0,
      complete: items.length > 0 && placedList.length === items.length
    };
  }

  function firstRemaining(state) {
    var items = (state && state.items) || [];
    return items.filter(function (it) { return !state.placed[it.id]; })[0] || null;
  }

  /**
   * Shape-matching check, used by activity 1. Size and rotation are ignored
   * on purpose: they never change shape identity, which is exactly what the
   * later rounds teach.
   */
  function checkShapeChoice(round, choice) {
    var ok = !!(choice && round && choice.shape === round.target.shape);
    if (ok) {
      return {
        ok: true,
        message: 'Yes! This is a ' + shapeOf(round.target.shape).label + '.'
      };
    }
    return {
      ok: false,
      hint: 'Look at the model: it has a ' + shapeOf(round.target.shape).label +
        ' — ' + SHAPE_HINTS[round.target.shape] + '.',
      message: 'A ' + (choice && choice.shape ? shapeOf(choice.shape).label : 'different shape') +
        '. Let us look again.'
    };
  }

  var SHAPE_HINTS = {
    circle: 'even and round, like the sun',
    square: 'four equal sides and four corners',
    triangle: 'three corners and three sides'
  };

  /* Narrower set of choices for a child who needs less at once (see the
     educator guide, "adapting to the child"). */
  function withFewerChoices(round, limit) {
    limit = limit || 2;
    var keep = [];
    var correct = null;
    (round.choices || []).forEach(function (c) {
      if (c.ok) { correct = c; }
    });
    (round.choices || []).forEach(function (c) {
      if (!c.ok && keep.length < limit - 1) { keep.push(c); }
    });
    if (correct) { keep.push(correct); }
    return Object.assign({}, round, { choices: keep });
  }

  function limitGroups(round, maxGroups) {
    maxGroups = maxGroups || 2;
    var groups = (round.groups || []).slice(0, maxGroups);
    var allowed = groups.map(function (g) { return g.key; });
    var items = (round.items || []).filter(function (it) {
      return allowed.indexOf(groupOf(it, round.mode)) !== -1;
    });
    return Object.assign({}, round, { groups: groups, items: items });
  }

  /* =====================================================================
   * 5. Progress — kept in memory and in localStorage only.
   * ===================================================================== */
  var ACTIVITY_ORDER = ['shapes', 'sorting', 'counting'];

  function createProgress() {
    return { done: {}, visited: {}, counts: {}, updated: null };
  }

  function markActivity(progress, activityId, payload) {
    if (!progress.visited) { progress.visited = {}; }
    if (!progress.done) { progress.done = {}; }
    if (!progress.counts) { progress.counts = {}; }
    progress.visited[activityId] = (progress.visited[activityId] || 0) + 1;
    if (payload && payload.finished) { progress.done[activityId] = true; }
    if (payload && typeof payload.count === 'number') {
      progress.counts[activityId] = payload.count;
    }
    progress.updated = 'saved';
    return progress;
  }

  function completedCount(progress) {
    return ACTIVITY_ORDER.filter(function (id) { return !!(progress && progress.done && progress.done[id]); }).length;
  }

  function nextPractice(progress) {
    var done = (progress && progress.done) || {};
    for (var i = 0; i < ACTIVITY_ORDER.length; i++) {
      if (!done[ACTIVITY_ORDER[i]]) {
        return ACTIVITY_META[ACTIVITY_ORDER[i]].suggest;
      }
    }
    return 'Everything worked out. Tomorrow, count three spoons on the table and sort them by size.';
  }

  var ACTIVITY_META = {
    shapes: {
      id: 'shapes',
      title: 'Shapes',
      aria: 'Activity 1: find the same shape',
      icon: 'shapes',
      intro: 'Find the same shape.',
      suggest: 'Next time, find circles and squares in the room: a plate, a clock, a window, a cushion.',
      minutes: '1–2 minutes'
    },
    sorting: {
      id: 'sorting',
      title: 'Sorting',
      aria: 'Activity 2: sort the shapes into the meadows',
      icon: 'sorting',
      intro: 'Sort the shapes into the meadows.',
      suggest: 'Next time, sort three pairs of socks by colour together — or three spoons and three forks.',
      minutes: '1–3 minutes'
    },
    counting: {
      id: 'counting',
      title: 'Counting to three',
      aria: 'Activity 3: count the toys from one to three',
      icon: 'counting',
      intro: 'Count the toys and pick the number.',
      suggest: 'Next time, count three apples in a bowl: one, two, three.',
      minutes: '1–2 minutes'
    }
  };

  /* =====================================================================
   * 6. Helpers and code-drawn artwork
   * ===================================================================== */
  function unique(arr) {
    var out = [];
    (arr || []).forEach(function (v) { if (out.indexOf(v) === -1) { out.push(v); } });
    return out;
  }

  function sameSet(a, b) {
    var x = unique(a).slice().sort();
    var y = unique(b).slice().sort();
    if (x.length !== y.length) { return false; }
    for (var i = 0; i < x.length; i++) { if (x[i] !== y[i]) { return false; } }
    return true;
  }

  function patternDefs(uid) {
    var red = COLORS.red, blue = COLORS.blue, yellow = COLORS.yellow;
    return '<defs>' +
      '<pattern id="dots-' + uid + '" width="14" height="14" patternUnits="userSpaceOnUse">' +
      '<circle cx="7" cy="7" r="2.6" fill="' + red.patternFill + '"/></pattern>' +
      '<pattern id="stripes-' + uid + '" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect x="0" y="0" width="7" height="14" fill="' + blue.patternFill + '"/></pattern>' +
      '<pattern id="crosshatch-' + uid + '" width="14" height="14" patternUnits="userSpaceOnUse">' +
      '<path d="M0 3.5 H14 M3.5 0 V14" stroke="' + yellow.patternStroke + '" stroke-width="2.2" fill="none"/></pattern>' +
      '</defs>';
  }

  function patternFillFor(colorId, uid) {
    var c = colorOf(colorId);
    if (!c || c.pattern === 'none' || !c.pattern) { return ''; }
    if (c.pattern === 'dots') { return 'url(#dots-' + uid + ')'; }
    if (c.pattern === 'stripes') { return 'url(#stripes-' + uid + ')'; }
    if (c.pattern === 'crosshatch') { return 'url(#crosshatch-' + uid + ')'; }
    return '';
  }

  /**
   * One shape as inline SVG. Callers pass an explicit uid so several copies
   * on one page never share pattern ids (which would cross-paint patterns).
   * `label` adds the written colour/shape name under the drawing: the visual
   * equivalent of audio and the colour-independent cue.
   */
  function shapeSvg(opts) {
    opts = opts || {};
    var uid = opts.uid || 'u';
    var shape = shapeOf(opts.shape);
    var color = colorOf(opts.color);
    var size = opts.size || 1;
    var degrees = opts.rotate || 0;
    var px = Math.round(120 * size);
    var extra = opts.neutralFill ? '#8FA08C' : color.hex;
    var fill = extra;
    var overlay = patternFillFor(opts.color, uid);
    var defs = (opts.withDefs === false) ? '' : patternDefs(uid);
    var label = opts.label === false ? '' : (opts.labelText || '');
    var cls = opts.className || 'shape-svg';
    var stroke = opts.stroke || '#123040CC';
    return '' +
      '<svg class="' + cls + '" viewBox="0 0 100 100" width="' + px + '" height="' + px + '" ' +
      'role="img" aria-hidden="true" focusable="false">' +
      defs +
      '<g transform="rotate(' + degrees + ' 50 50)">' +
      '<path d="' + shape.path + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="6" stroke-linejoin="round"/>' +
      (overlay ? '<path d="' + shape.path + '" fill="' + overlay + '"/>' : '') +
      '</g>' +
      '</svg>' +
      (label ? '<span class="swatch-label">' + label + '</span>' : '');
  }

  /** Small numeral card (1..3) used by the counting answer buttons. */
  function numeralCard(n, opts) {
    opts = opts || {};
    var cx = opts.cx || 50, cy = opts.cy || 50, r = opts.r || 34;
    var uid = opts.uid || 'n';
    return '<svg class="numeral-svg" viewBox="0 0 100 100" width="' + (opts.px || 96) + '" height="' + (opts.px || 96) + '" role="img" aria-hidden="true" focusable="false">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (opts.fill || '#FFF3DC') + '" stroke="#123040" stroke-width="5"/>' +
      '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="44" font-weight="800" fill="#123040">' + n + '</text>' +
      '</svg>';
  }

  var api = {
    SHAPES: SHAPES,
    SHAPE_IDS: SHAPE_IDS,
    COLORS: COLORS,
    COLOR_IDS: COLOR_IDS,
    COLOR_GROUP_SHAPE: COLOR_GROUP_SHAPE,
    NEUTRAL: NEUTRAL,
    SHAPE_HINTS: SHAPE_HINTS,
    COUNT_STEPS: COUNT_STEPS,
    COUNT_ROUNDS: COUNT_ROUNDS,
    ACTIVITY_ORDER: ACTIVITY_ORDER,
    ACTIVITY_META: ACTIVITY_META,
    shapeRounds: shapeRounds,
    sortingRounds: sortingRounds,
    colorOf: colorOf,
    shapeOf: shapeOf,
    clampCount: clampCount,
    createCountState: createCountState,
    tapCount: tapCount,
    resetCountState: resetCountState,
    isCountComplete: isCountComplete,
    highlightAudit: highlightAudit,
    createSortState: createSortState,
    groupOf: groupOf,
    describeItem: describeItem,
    expectedGroupLabel: expectedGroupLabel,
    place: place,
    sortProgress: sortProgress,
    firstRemaining: firstRemaining,
    checkShapeChoice: checkShapeChoice,
    withFewerChoices: withFewerChoices,
    limitGroups: limitGroups,
    createProgress: createProgress,
    markActivity: markActivity,
    completedCount: completedCount,
    nextPractice: nextPractice,
    shapeSvg: shapeSvg,
    numeralCard: numeralCard,
    patternDefs: patternDefs,
    unique: unique,
    sameSet: sameSet
  };

  return api;
}));

</script>
<script>
/* ===========================================================================
 * Shapes, Colours and Sorting Garden — the application.
 * Part 1: sound (optional), state, hash routing, lasting progress memory,
 * the start screen and the shell.
 *
 * Rules built into the code:
 *  • no answer ever blocks the activity: a wrong choice always leaves the
 *    activity usable and gives a hint;
 *  • sound starts only after the child acts, is off by default, and every
 *    spoken message has a written twin;
 *  • progress is kept only in this browser (localStorage) and is erased by
 *    the "Reset" button.
 * =========================================================================== */
(function () {
  'use strict';

  var C = window.Core;
  var app = document.getElementById('app-root');

  /* ----------------------------------------------------------------- sound --- */
  var Sound = (function () {
    var ctx = null;
    var available = !!(window.AudioContext || window.webkitAudioContext);
    var enabled = false;

    function ensure() {
      if (!available) { return null; }
      if (!ctx) {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { available = false; return null; }
      }
      if (ctx && ctx.state === 'suspended' && ctx.resume) {
        try { ctx.resume(); } catch (e) {}
      }
      return ctx;
    }

    function tone(freq, start, dur, type, gain) {
      var c = ensure();
      if (!c) { return; }
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      var t0 = c.currentTime + start;
      var peak = gain || 0.16;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }

    var MAP = {
      /* "yes" — softly up, with no winning fanfare noise */
      correct: [[523.25, 0, 0.16], [659.25, 0.14, 0.22]],
      /* hint — one calm tone, nothing that sounds like a mistake */
      hint: [[392.00, 0, 0.24]],
      /* counting — even steps, the last one a little higher */
      count1: [[440.00, 0, 0.18]],
      count2: [[493.88, 0, 0.18]],
      count3: [[587.33, 0, 0.26]],
      /* activity finished — three calm notes */
      done: [[523.25, 0, 0.2], [659.25, 0.18, 0.2], [783.99, 0.36, 0.3]],
      /* screen change */
      step: [[330.00, 0, 0.12]]
    };

    return {
      isAvailable: function () { return available; },
      isEnabled: function () { return enabled && available; },
      setEnabled: function (on) {
        enabled = !!on && available;
        if (enabled) { ensure(); }
        return enabled;
      },
      play: function (name) {
        if (!enabled || !available) { return false; }
        var seq = MAP[name];
        if (!seq) { return false; }
        seq.forEach(function (n, i) {
          tone(n[0], n[1], n[2], name.indexOf('count') === 0 ? 'triangle' : 'sine', i === seq.length - 1 ? 0.18 : 0.14);
        });
        return true;
      },
      /* Speech is an extra; if there is no voice, the activity goes on silently. */
      say: function (text) {
        if (!enabled || !text) { return false; }
        var sy = window.speechSynthesis;
        if (!sy || typeof window.SpeechSynthesisUtterance !== 'function') { return false; }
        try {
          sy.cancel();
          var u = new window.SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.92;
          u.pitch = 1.05;
          var voices = sy.getVoices ? sy.getVoices() : [];
          var en = null;
          for (var i = 0; i < voices.length; i++) {
            if (voices[i] && /^en/i.test(voices[i].lang || '')) { en = voices[i]; break; }
          }
          if (en) { u.voice = en; }
          sy.speak(u);
          return true;
        } catch (e) { return false; }
      },
      stopSpeaking: function () {
        if (window.speechSynthesis && window.speechSynthesis.cancel) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
      }
    };
  }());

  /* --------------------------------------------------------------- progress --- */
  var STORE_KEY = 'shapes-garden-progress-v1';

  function storageAvailable() {
    try {
      window.localStorage.setItem('__sg_test__', '1');
      window.localStorage.removeItem('__sg_test__');
      return true;
    } catch (e) { return false; }
  }

  var storage = {
    ok: storageAvailable(),
    read: function () {
      if (!this.ok) { return null; }
      try {
        var raw = window.localStorage.getItem(STORE_KEY);
        if (!raw) { return null; }
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') { return null; }
        if (!parsed.visited) { parsed.visited = {}; }
        if (!parsed.done) { parsed.done = {}; }
        if (!parsed.counts) { parsed.counts = {}; }
        return parsed;
      } catch (e) { return null; }
    },
    write: function (progress) {
      if (!this.ok) { return false; }
      try {
        window.localStorage.setItem(STORE_KEY, JSON.stringify(progress));
        return true;
      } catch (e) { return false; }
    },
    clear: function () {
      if (!this.ok) { return false; }
      try { window.localStorage.removeItem(STORE_KEY); return true; } catch (e) { return false; }
    }
  };

  /* -------------------------------------------------------------------- state --- */
  var S = {
    screen: 'start',
    activity: null,
    progress: storage.read() || C.createProgress(),
    soundOn: false,
    grownupOpen: false,
    textSize: 'normal',   /* normal | large */
    fewerChoices: false,
    /* activity state */
    shapeRound: 0,
    shapeFeedback: null,
    shapeHinted: false,
    shapeSolved: {},
    shapeDemoPlayed: false,
    sortRound: 0,
    sortState: null,
    sortSelected: null,
    sortFeedback: null,
    sortDemoPlayed: false,
    sortStageMistakes: 0,
    sortPendingDemo: false,
    finishedActivity: null,
    countRound: 0,
    countState: null,
    countFeedback: null,
    countAnswerNeeded: false,
    countAnswered: {},
    countDemoRunning: false,
    countDemoIndex: 0,
    /* internal */
    uid: 0,
    focusTarget: null,
    timers: [],
    announce: '',
    announceKind: 'polite',
    announceSeq: 0
  };

  function uid() { S.uid += 1; return 'u' + S.uid; }

  /* ------------------------------------------------------------------ render ---
   * State logic lives in this script block and drawing lives in the next one.
   * There is exactly one contract between them: on load the drawing layer puts
   * its function into __GARDEN__.render, and this block calls render() by name.
   * The stub prevents a crash if the drawing layer has not loaded for some
   * reason: the activity then reports itself in words instead of staying mute. */
  function render() {
    if (typeof window.__GARDEN__.render === 'function') { window.__GARDEN__.render(); }
  }
  function clearTimers() { S.timers.forEach(function (t) { window.clearTimeout(t); }); S.timers = []; }
  function later(fn, ms) { var t = window.setTimeout(fn, ms); S.timers.push(t); return t; }
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* Less motion — shorter demonstration delays. */
  function reducedMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  function stepDelay(ms) { return reducedMotion() ? Math.min(ms, 260) : ms; }

  function saveProgress() {
    storage.write(S.progress);
    updateStorageNote();
  }

  function markDone(activityId, payload) {
    var before = C.completedCount(S.progress);
    C.markActivity(S.progress, activityId, payload || {});
    saveProgress();
    return { completed: C.completedCount(S.progress), gained: C.completedCount(S.progress) > before };
  }

  /* ------------------------------------------------------------------ routing --- */
  var HASH_ROUTES = {
    '#activity-1': { screen: 'activity', activity: 'shapes' },
    '#activity-2': { screen: 'activity', activity: 'sorting' },
    '#activity-3': { screen: 'activity', activity: 'counting' },
    '#shapes': { screen: 'activity', activity: 'shapes' },
    '#sorting': { screen: 'activity', activity: 'sorting' },
    '#counting': { screen: 'activity', activity: 'counting' },
    '#start': { screen: 'start' },
    '#home': { screen: 'home' },
    '#done': { screen: 'done' },
    '#grownups': { screen: 'grownups' }
  };

  function hashForActivity(id) {
    if (id === 'shapes') { return '#activity-1'; }
    if (id === 'sorting') { return '#activity-2'; }
    if (id === 'counting') { return '#activity-3'; }
    return '#home';
  }

  function routeFromHash(hash) {
    if (!hash) { return null; }
    var h = String(hash).trim().toLowerCase();
    if (!h) { return null; }
    if (h.charAt(0) !== '#') { h = '#' + h; }
    return HASH_ROUTES[h] || null;
  }

  /* Programmatic navigation: we update the hash and one handler applies it. */
  function go(hash) {
    var target = hash || '#home';
    if (window.location.hash === target) {
      applyRoute(target, false);
    } else {
      window.location.hash = target;
    }
  }

  /* The only place where the screen changes by address. */
  function applyRoute(hash, fromUrl) {
    var route = routeFromHash(hash);
    if (!route) { return false; }
    if (route.screen === 'activity') {
      openActivity(route.activity, { viaRoute: true, focus: !!fromUrl });
    } else if (route.screen === 'start') {
      showStart({ focus: !!fromUrl });
    } else if (route.screen === 'home') {
      showHome();
    } else if (route.screen === 'done') {
      showDone({ focus: !!fromUrl });
    } else if (route.screen === 'grownups') {
      showHome();
      S.grownupOpen = true;
      render();
      return true;
    }
    return true;
  }

  window.addEventListener('hashchange', function () {
    applyRoute(window.location.hash, true);
  });

  /* -------------------------------------------------------------- navigation --- */
  function resetActivityState() {
    clearTimers();
    Sound.stopSpeaking();
    S.shapeFeedback = null; S.shapeHinted = false; S.shapeSolved = {}; S.shapeDemoPlayed = false;
    S.sortSelected = null; S.sortFeedback = null; S.sortDemoPlayed = false; S.sortStageMistakes = 0;
    S.countFeedback = null; S.countAnswerNeeded = false; S.countAnswered = {}; S.countDemoRunning = false;
  }

  function showStart(opts) {
    resetActivityState();
    S.screen = 'start';
    S.activity = null;
    S.grownupOpen = !!(opts && opts.grownup);
    if (!opts || opts.focus !== false) { S.focusTarget = 'start-heading'; }
    render();
  }

  function showHome(opts) {
    resetActivityState();
    S.screen = 'home';
    S.activity = null;
    if (opts && opts.focus) { S.focusTarget = 'home-heading'; }
    render();
  }

  function showDone(opts) {
    resetActivityState();
    S.screen = 'done';
    S.activity = null;
    if (opts && opts.sound !== false) { Sound.play('done'); }
    S.focusTarget = 'done-heading';
    render();
  }

  function openActivity(id, opts) {
    if (!C.ACTIVITY_META[id]) { return; }
    var sameActivity = (S.activity === id && S.screen === 'activity' && !(opts && opts.reset));
    if (!sameActivity) { resetActivityState(); }
    S.screen = 'activity';
    S.activity = id;
    C.markActivity(S.progress, id, {});   /* visited, but not done */
    saveProgress();
    if (id === 'shapes') { initShapeActivity(opts); }
    if (id === 'sorting') { initSortActivity(opts); }
    if (id === 'counting') { initCountActivity(opts); }
    if (!(opts && opts.silent)) { Sound.play('step'); }
    if (opts && opts.focus) { S.focusTarget = id + '-heading'; }
    render();
  }

  /* ============================================================= activity 1 ===
   * Shape matching. The model is above; below are 2–3 large numbered choices.
   * The first turn is played by the app (demonstration), then the child leads.
   * ========================================================================= */
  function activeShapeRounds() {
    var rounds = C.shapeRounds();
    if (S.fewerChoices) {
      rounds = rounds.map(function (r) { return C.withFewerChoices(r, 2); });
    }
    return rounds;
  }

  function initShapeActivity(opts) {
    opts = opts || {};
    var rounds = activeShapeRounds();
    if (opts.reset) { S.shapeRound = 0; }
    if (S.shapeRound >= rounds.length) { S.shapeRound = 0; }
    S.shapeDemoPlayed = false;
    S.shapeHinted = false;
    S.shapeFeedback = null;
    if (opts.playDemo) { playShapeDemo(); }
    return rounds[S.shapeRound];
  }

  function playShapeDemo() {
    var round = activeShapeRounds()[S.shapeRound];
    if (!round) { return; }
    S.shapeDemoPlayed = true;
    var correct = round.choices.filter(function (c) { return c.ok; })[0];
    var idx = round.choices.indexOf(correct);
    setAnnounce('Example: we tap choice ' + (idx + 1) + '.', 'polite');
    render();
    later(function () {
      var node = el('shape-choice-' + idx);
      if (node) { node.classList.add('demo-ghost'); }
      Sound.play('step');
    }, stepDelay(120));
    later(function () {
      var node = el('shape-choice-' + idx);
      if (node) { node.classList.remove('demo-ghost'); }
      S.shapeFeedback = { kind: 'good', text: 'Here is how: ' + C.shapeOf(round.target.shape).label + ' — that is choice ' + (idx + 1) + '. Now it is your turn.' };
      S.shapeHinted = true;
      setAnnounce(S.shapeFeedback.text, 'polite');
      render();
    }, stepDelay(1500));
  }

  function answerShape(index) {
    var rounds = activeShapeRounds();
    var round = rounds[S.shapeRound];
    if (!round) { return; }
    var choice = round.choices[index];
    if (!choice) { return; }
    var res = C.checkShapeChoice(round, choice);
    if (res.ok) {
      S.shapeSolved[round.id] = true;
      S.shapeFeedback = { kind: 'good', text: res.message + ' ' + SHAPE_PRAISE[S.shapeRound % SHAPE_PRAISE.length] };
      Sound.play('correct');
      Sound.say(res.message);
      setAnnounce(S.shapeFeedback.text, 'polite');
      render();
      later(function () {
        if (S.screen !== 'activity' || S.activity !== 'shapes') { return; }
        if (S.shapeRound + 1 < rounds.length) {
          S.shapeRound += 1;
          initShapeActivity({});
          render();
        } else {
          completeActivity('shapes');
        }
      }, stepDelay(1400));
    } else {
      /* A wrong choice: the activity stays usable, we give a gentle hint. */
      S.shapeHinted = true;
      S.shapeFeedback = { kind: 'care', text: res.hint, sub: 'Try again — you can try as many times as you like.' };
      Sound.play('hint');
      Sound.say('Look at the model. ' + C.SHAPE_HINTS[round.target.shape] + '.');
      setAnnounce(S.shapeFeedback.text, 'polite');
      render();
      var node = el('shape-choice-' + index);
      if (node) {
        node.classList.add('is-wrong');
        later(function () { node.classList.remove('is-wrong'); }, 1600);
      }
    }
  }

  function showShapeHint() {
    var rounds = activeShapeRounds();
    var round = rounds[S.shapeRound];
    if (!round) { return; }
    var correct = round.choices.filter(function (c) { return c.ok; })[0];
    var idx = round.choices.indexOf(correct);
    S.shapeHinted = true;
    S.shapeFeedback = {
      kind: 'care',
      text: 'Hint: choice ' + (idx + 1) + ' fits — it has a ' + C.shapeOf(round.target.shape).label + ', ' + C.SHAPE_HINTS[round.target.shape] + '.',
      sub: 'You can tap it or listen once more.'
    };
    Sound.play('hint');
    Sound.say(S.shapeFeedback.text);
    setAnnounce(S.shapeFeedback.text, 'polite');
    render();
    var node = el('shape-choice-' + idx);
    if (node) {
      node.classList.add('is-hinted');
      later(function () { node.classList.remove('is-hinted'); }, 2200);
    }
  }

  var SHAPE_PRAISE = ['You did it!', 'That is right!', 'Exactly the same!', 'Yes, that is the one!', 'Well done!', 'Great!'];

  /* ============================================================= activity 2 ===
   * Sorting by ONE visible property. First by colour (each meadow has its own
   * pattern, its own shape and its own label, so colour is never the only
   * support), then a fresh application: sorting by shape, where every item is
   * the same colour and the colour cue is removed completely.
   * ========================================================================= */
  function activeSortRounds() {
    if (S.fewerChoices) {
      return [
        C.limitGroups(C.sortingRounds()[0], 2),
        C.limitGroups(C.sortingRounds()[2], 2)
      ];
    }
    return C.sortingRounds();
  }

  function initSortActivity(opts) {
    opts = opts || {};
    var rounds = activeSortRounds();
    if (opts.reset) { S.sortRound = 0; }
    if (S.sortRound >= rounds.length) { S.sortRound = 0; }
    var round = rounds[S.sortRound] || rounds[0];
    S.sortState = C.createSortState(round);
    S.sortSelected = null;
    S.sortFeedback = null;
    S.sortDemoPlayed = false;
    S.sortStageMistakes = 0;
    /* The demonstration piece places itself only when the child has pressed
       "Show me" — otherwise the activity waits for the child's move. */
    S.sortPendingDemo = !!round.demo;
    if (opts.playDemo) { playSortDemo(); S.sortPendingDemo = false; }
    return round;
  }

  function playSortDemo() {
    var rounds = activeSortRounds();
    var round = rounds[S.sortRound];
    if (!round || !S.sortState) { return; }
    var demoItem = round.items.filter(function (it) { return it.demo; })[0];
    if (!demoItem) { demoItem = C.firstRemaining(S.sortState); }
    if (!demoItem) { return; }
    var res = C.place(S.sortState, demoItem.id, C.groupOf(demoItem, round.mode));
    S.sortDemoPlayed = true;
    S.sortSelected = null;
    S.sortFeedback = { kind: 'good', text: 'Example: ' + res.message, sub: 'Now sort the other shapes.' };
    Sound.play('step');
    setAnnounce(S.sortFeedback.text, 'polite');
    render();
    if (C.sortProgress(S.sortState).complete) { later(function () { if (S.activity === 'sorting') { completeActivity('sorting'); } }, stepDelay(1200)); }
  }

  function selectPiece(itemId) {
    if (S.sortSelected === itemId) { S.sortSelected = null; } else { S.sortSelected = itemId; }
    S.sortFeedback = null;
    Sound.play('step');
    render();
  }

  function dropInto(groupKey) {
    var rounds = activeSortRounds();
    var round = rounds[S.sortRound];
    if (!round || !S.sortState) { return; }
    var itemId = S.sortSelected;
    if (!itemId) {
      itemId = (C.firstRemaining(S.sortState) || {}).id;
    }
    if (!itemId) { return; }
    var res = C.place(S.sortState, itemId, groupKey);
    if (res.ok) {
      S.sortSelected = null;
      S.sortFeedback = { kind: 'good', text: res.message };
      Sound.play('correct');
      Sound.say(res.message);
      setAnnounce(res.message, 'polite');
      render();
      var bin = el('sort-bin-' + groupKey);
      if (bin) { bin.classList.add('is-good'); }
      if (res.complete) {
        later(function () { if (S.activity === 'sorting') { completeSortRound(); } }, stepDelay(1300));
      }
      return;
    }
    /* A wrong meadow: the piece stays where it is and the activity goes on. */
    S.sortStageMistakes += 1;
    S.sortFeedback = { kind: 'care', text: res.hint, sub: res.message };
    Sound.play('hint');
    Sound.say('Try another meadow.');
    setAnnounce(res.hint, 'polite');
    render();
    var node = el('sort-bin-' + groupKey);
    if (node) {
      node.classList.add('is-care');
      later(function () { node.classList.remove('is-care'); }, 1700);
    }
  }

  function completeSortRound() {
    var rounds = activeSortRounds();
    if (S.sortRound + 1 < rounds.length) {
      S.sortRound += 1;
      initSortActivity({});
      render();
    } else {
      completeActivity('sorting');
    }
  }

  /* ============================================================= activity 3 ===
   * Counting a tiny collection. The toys are revealed one at a time and each
   * one is highlighted exactly once (the automated tests check this too). The
   * child confirms the answer by pressing a number.
   * ========================================================================= */
  function activeCountRounds() { return C.COUNT_ROUNDS; }

  function initCountActivity(opts) {
    opts = opts || {};
    var rounds = activeCountRounds();
    if (opts.reset) { S.countRound = 0; }
    if (S.countRound >= rounds.length) { S.countRound = 0; }
    var round = rounds[S.countRound] || rounds[0];
    S.countState = C.createCountState(round.count);
    S.countFeedback = null;
    S.countAnswerNeeded = false;
    S.countAnswered = {};
    S.countDemoRunning = false;
    S.countDemoIndex = 0;
    if (opts.playDemo) { runCountDemo(); }
    return round;
  }

  /* The counting demonstration: the toys reveal themselves, one at a time,
     each exactly once, with no sound — just a model of the order "one, two,
     three". Then the state is reset and the child counts alone. */
  function runCountDemo() {
    clearTimers();
    if (!S.countState) { return; }
    C.resetCountState(S.countState);
    S.countAnswerNeeded = false;
    S.countDemoIndex = 0;
    S.countDemoRunning = true;
    S.countFeedback = { kind: 'idle', text: 'Watch the example: one, two, three.' };
    render();
    var total = S.countState.sequence.length;
    for (var i = 1; i <= total; i++) {
      (function (n) {
        later(function () {
          if (S.screen !== 'activity' || S.activity !== 'counting' || !S.countState) { return; }
          C.tapCount(S.countState);
          Sound.play('count' + n);
          render();
          if (n === total) {
            S.countDemoRunning = false;
            S.countAnswerNeeded = true;
            S.countFeedback = {
              kind: 'good',
              text: 'That is how we count: one, two, three. Now tap the arrow button and count by yourself.'
            };
            C.resetCountState(S.countState);
            setAnnounce(S.countFeedback.text, 'polite');
            render();
          }
        }, stepDelay(900 * n));
      }(i));
    }
  }

  function countTap() {
    if (!S.countState) { return; }
    if (C.isCountComplete(S.countState)) {
      S.countAnswerNeeded = true;
      S.countFeedback = { kind: 'care', text: 'All the toys are counted. Pick the number — how many are there?', sub: 'You can tap "Count again".' };
      render();
      return;
    }
    C.tapCount(S.countState);
    S.countFeedback = null;
    Sound.play('count' + S.countState.count);
    Sound.say(String(S.countState.count));
    setAnnounce('Counting: ' + S.countState.count, 'polite');
    if (C.isCountComplete(S.countState)) {
      S.countAnswerNeeded = true;
      S.countFeedback = { kind: 'good', text: 'We counted: ' + S.countState.sequence.length + '. Now pick that number.' };
      Sound.say('How many did you count?');
    }
    render();
  }

  function resetCounting() {
    if (!S.countState) { return; }
    C.resetCountState(S.countState);
    S.countAnswerNeeded = false;
    S.countFeedback = { kind: 'idle', text: 'Counting again. Tap the arrow button.' };
    setAnnounce(S.countFeedback.text, 'polite');
    render();
  }

  function answerCount(n) {
    if (!S.countState) { return; }
    var rounds = activeCountRounds();
    var round = rounds[S.countRound];
    var target = S.countState.sequence.length;
    if (n === target) {
      S.countAnswered[round.id] = true;
      S.countFeedback = { kind: 'good', text: 'Yes! There are ' + target + '. ' + COUNT_PRAISE[S.countRound % COUNT_PRAISE.length] };
      Sound.play('correct');
      Sound.say('Yes, there are ' + target);
      setAnnounce(S.countFeedback.text, 'polite');
      render();
      later(function () {
        if (S.screen !== 'activity' || S.activity !== 'counting') { return; }
        if (S.countRound + 1 < rounds.length) {
          S.countRound += 1;
          initCountActivity({});
          render();
        } else {
          completeActivity('counting');
        }
      }, stepDelay(1500));
    } else {
      /* Gently: we name what the child picked and offer to count again. */
      S.countFeedback = {
        kind: 'care',
        text: 'You picked ' + n + '. Let us count together again: tap the arrow button and say: one, two, three.',
        sub: 'You can pick a number as many times as you like.'
      };
      Sound.play('hint');

<script>

        '<rect x="18" y="26" width="64" height="60" rx="8" fill="' + color + '" stroke="#123040" stroke-width="6"/>' +
        '<path d="M18 46 H82" stroke="#FFFFFF" stroke-width="7"/>' +

  }

  /* ---------------------------------------------------------------- status --- */
  function idleText() {
    if (S.screen === 'activity') {

    if (S.activity === 'counting') { return S.countFeedback; }

  }

  function statusBox(feedback) {
    var kind = (feedback && feedback.kind) || 'idle';
    var text = (feedback && feedback.text) || idleText();
    var sub = feedback && feedback.sub ? feedback.sub : '';

  /* ---------------------------------------------------------------- header --- */
  function soundIcon(on) {
    return on
      ? '<svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true" focusable="false"><path d="M14 38 H30 L52 20 V80 L30 62 H14 Z" fill="#152B36"/><path d="M62 34 A24 24 0 0 1 62 66" fill="none" stroke="#146B3A" stroke-width="8" stroke-linecap="round"/><path d="M74 24 A38 38 0 0 1 74 76" fill="none" stroke="#146B3A" stroke-width="8" stroke-linecap="round"/></svg>'

  }

  function topbar() {

    var total = C.ACTIVITY_ORDER.length;

      '<header class="topbar no-print">' +
        '<div class="topbar-in">' +
          '<button class="icon-btn" data-action="goto-start" data-focus-key="brand" aria-label="Shapes and Sorting Garden. Go to the start of the activity">' +
            '<svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
              '<circle cx="50" cy="82" r="14" fill="#146B3A"/>' +
              '<path d="M50 74 C50 52 36 42 22 40 C26 60 38 70 50 74 Z" fill="#8FA08C" stroke="#123040" stroke-width="4"/>' +
              '<path d="M50 74 C50 52 64 42 78 40 C74 60 62 70 50 74 Z" fill="#146B3A" stroke="#123040" stroke-width="4"/>' +
              '<path d="M50 78 V46" stroke="#123040" stroke-width="5" stroke-linecap="round"/>' +
              '<circle cx="50" cy="34" r="12" fill="#A87D00" stroke="#123040" stroke-width="4"/>' +
            '</svg>' +
            '<span><span class="brand">Shapes and Sorting Garden</span>' +
            '<span class="brand-sub">an activity for three-year-olds</span></span>' +
          '</button>' +
          '<button class="icon-btn" data-action="toggle-sound" data-focus-key="sound" aria-pressed="' + (soundOn ? 'true' : 'false') + '">' +
            soundIcon(soundOn) +

          '</button>' +
          '<button class="icon-btn" data-action="toggle-grownup" data-focus-key="grownup" aria-expanded="' + (S.grownupOpen ? 'true' : 'false') + '">' +

          '</button>' +

      '<footer class="foot-note" style="margin-top:26px">' +
        '<p id="storage-note">Progress is saved only in this browser.</p>' +
        '<p>No ads, no sign-up, no analytics and no collection of data about the child. The code and all the artwork were made for this task, MIT licence.</p>' +
      '</footer>';
  }

  /* ----------------------------------------------------------------- cards --- */
  function activityCards() {
    return '<div class="choices" data-count="3" style="margin-top:18px">' +
      C.ACTIVITY_ORDER.map(function (id, i) {

      '</div>';
  }

  /* ================================================================ screens === */
  function screenStart() {
    return '' +
      '<div class="wrap stack">' +
        '<section class="card">' +
          '<div class="done-hero">' +
            '<svg viewBox="0 0 120 120" width="112" height="112" aria-hidden="true" focusable="false">' +
              '<circle cx="60" cy="92" r="20" fill="#146B3A"/>' +
              '<path d="M60 84 C60 52 42 40 22 36 C28 66 44 80 60 84 Z" fill="#8FA08C" stroke="#123040" stroke-width="4"/>' +
              '<path d="M60 84 C60 52 78 40 98 36 C92 66 76 80 60 84 Z" fill="#146B3A" stroke="#123040" stroke-width="4"/>' +
              '<circle cx="60" cy="30" r="16" fill="#A87D00" stroke="#123040" stroke-width="4"/>' +
              '<path d="M60 46 V90" stroke="#123040" stroke-width="6" stroke-linecap="round"/>' +
            '</svg>' +
            '<div style="flex:1 1 320px">' +
              '<h1 id="start-heading">Shapes, Colours and Sorting Garden</h1>' +
              '<p>Three short activities for a child of about three: match the same shape, sort shapes into meadows and count toys up to three. A grown-up should be nearby, and you can stop at any moment.</p>' +
              '<p class="foot-note">No reading or writing needed: everything is done by tapping. Sound is off until a grown-up turns it on with the button at the top.</p>' +
            '</div>' +
          '</div>' +
          '<div class="btn-row" style="margin-top:20px">' +
            '<button class="btn" data-action="begin" data-focus-key="begin">Start the activity</button>' +
            '<button class="btn btn-plain" data-action="goto-home">Choose an activity</button>' +

        '<section class="card-soft" aria-labelledby="start-how">' +

      '<div class="wrap stack">' +
        '<section class="card">' +

  /* --- Activity 1: shapes --- */
  function screenShapes() {

      '<div class="target">' +
        '<div class="target-body">' +

      '</div>' +

          '<span class="tile-index">' + (i + 1) + '</span>' +

  function fewerNote() {

  }

  function shapeName(c) {
    if (!c) { return 'shape'; }
    return C.colorOf(c.color).label + ' ' + C.shapeOf(c.shape).label;
  }

  /* --- Activity 2: sorting --- */
  function screenSorting() {
    var rounds = G.activeSortRoundsValue();
    var round = rounds[S.sortRound];
    if (!round || !S.sortState) { return screenHome(); }
    var st = S.sortState;
    var remaining = st.items.filter(function (it) { return !st.placed[it.id]; });

        'aria-label="Meadow: ' + esc(g.label) + '. Shapes here: ' + placedItems.length + '">' +
        '<span class="bin-head">' +
          C.shapeSvg({ shape: swatchShape, color: g.neutral ? 'neutral' : g.key, uid: u(), size: 0.62, label: false }) +
          '<span class="bin-title">' +
            '<span class="bin-caption">' + esc(g.label) + '</span>' +
            '<span class="bin-count">Shapes here: ' + placedItems.length + ' of ' + st.items.length + '</span>' +
          '</span>' +
        '</span>' +
        '<span class="bin-slot">' + (placedItems.length
          ? placedItems.map(function (it) { return pieceSvgSpan(it, 58); }).join('')
          : '<span class="foot-note">Empty for now</span>') + '</span>' +
        '</button>';
    }).join('');

    var modeNote = round.mode === 'shape'
      ? '<div class="coach"><strong>Here colour is not a clue.</strong> All the shapes are the same colour, so we look only at the shape.</div>'
      : '<div class="coach"><strong>We tell them apart by more than colour.</strong> Each meadow has its own pattern, its own shape and its own label: round with dots, square with stripes, triangle with a grid.</div>';

    var stage = '' +
      '<p><strong>' + esc(round.prompt) + '</strong></p>' +
      '<p class="tray-title">Shapes waiting for their meadow:</p>' +
      '<div class="tray" role="group" aria-label="Shapes to sort">' + tray + '</div>' +
      '<div class="bins-inline" role="group" aria-label="Meadows">' + bins + '</div>' +
      '<div style="margin-top:12px">' + modeNote + '</div>';

    return activityShell(
      'sorting-heading',
      C.ACTIVITY_META.sorting.title,
      'Step ' + (S.sortRound + 1) + ' of ' + rounds.length,
      stage,
      activityControls('<span class="chip" data-focus-key="selected-chip">Selected: ' +
