  function byId(st, id) {
    return st.items.filter(function (it) { return it.id === id; })[0] || null;
  }

  function pieceName(item) {
    return item ? C.describeItem(item) : 'shape';
  }

  function pieceButton(item) {
    var selected = S.sortSelected === item.id;
    return '<button class="piece' + (selected ? ' is-selected' : '') + '" id="piece-' + item.id + '" ' +
      'data-action="select-piece" data-item="' + item.id + '" data-focus-key="piece-' + item.id + '" ' +
      'aria-pressed="' + (selected ? 'true' : 'false') + '" ' +
      'aria-label="' + esc(pieceName(item)) + (selected ? ', selected' : '') + '">' +
      pieceSvgSpan(item, 76) +
      '<span class="piece-name">' + esc(pieceName(item)) + (selected ? ' — selected' : '') + '</span>' +
      '</button>';
  }

  function pieceSvgSpan(item, px) {
    return '<span class="piece-visual">' +
      C.shapeSvg({ shape: item.shape, color: item.color, uid: u(), size: px / 120, label: false }) +
      '</span>';
  }

  /* --- Activity 3: counting --- */
  function screenCounting() {
    var rounds = G.activeCountRoundsValue();
    var round = rounds[S.countRound];
    if (!round || !S.countState) { return screenHome(); }
    var st = S.countState;
    var slots = '';
    for (var i = 0; i < st.sequence.length; i++) {
      var counted = i < st.revealed;
      var active = counted && (i === st.revealed - 1);
      var kind = TOY_KINDS[i % TOY_KINDS.length];
      var color = TOY_COLORS[i % TOY_COLORS.length];
      slots += '<div class="slot' + (counted ? ' is-counted' : '') + (active ? ' is-active' : '') + '">' +
        '<span class="slot-halo" aria-hidden="true"></span>' +
        '<span class="number-tag" aria-hidden="true">' + (i + 1) + '</span>' +
        '<span class="' + (counted ? '' : 'toy-hidden') + '">' + toySvg(kind, color, 84) + '</span>' +
        '</div>';
    }
    var complete = C.isCountComplete(st);
    var numBtns = [1, 2, 3].map(function (n) {
      return '<button class="num-btn" id="count-answer-' + n + '" ' +
        'data-action="answer-count" data-number="' + n + '" data-focus-key="answer-' + n + '" ' +
        'aria-label="Number ' + n + '"' + (st.count < 1 ? ' aria-disabled="true"' : '') + '>' +
        C.numeralCard(n, { uid: u(), px: 64 }) +
        '<span>That many</span>' +
        '</button>';
    }).join('');

    var arrowLabel = complete
      ? 'Counted: ' + st.sequence.length
      : 'Counting: ' + (st.count + 1);
    var arrowAria = complete
      ? 'All the toys are counted. Now pick the number: ' + st.sequence.length + '.'
      : 'Counting on: tap to reveal and count ' + (st.count + 1) + '.';

    var stage = '' +
      '<p><strong>' + esc(round.prompt) + '</strong></p>' +
      '<div class="shelf" role="group" aria-label="Toys on the shelf">' + slots + '</div>' +
      '<div class="counter-panel">' +
        '<button class="arrow-btn" data-action="count-tap" data-focus-key="count-tap" ' +
          'aria-label="' + esc(arrowAria) + '"' + (complete ? ' aria-disabled="true"' : '') + '>' +
          '<svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true" focusable="false">' +
            '<circle cx="50" cy="50" r="44" fill="#FFFFFF" opacity=".25"/>' +
            '<path d="M26 50 H68 M54 32 L74 50 L54 68" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>' +
          esc(arrowLabel) +
        '</button>' +
        '<div class="num-row" role="group" aria-label="How many toys">' + numBtns + '</div>' +
      '</div>' +
      '<div class="toy-picker">' +
        '<span class="foot-note">You can make your own collection:</span>' +
        '<button class="btn btn-plain" data-action="set-count" data-count="1" data-focus-key="set-1">1 toy</button>' +
        '<button class="btn btn-plain" data-action="set-count" data-count="2" data-focus-key="set-2">2 toys</button>' +
        '<button class="btn btn-plain" data-action="set-count" data-count="3" data-focus-key="set-3">3 toys</button>' +
      '</div>';

    return activityShell(
      'counting-heading',
      C.ACTIVITY_META.counting.title,
      'Step ' + (S.countRound + 1) + ' of ' + rounds.length,
      stage,
      activityControls('<button class="btn btn-plain" data-action="count-reset" data-focus-key="count-reset">Count again</button>' + fewerNote())
    );
  }

  /* --------------------------------------------------- finishing one step --- */
  function screenActivityDone() {
    var id = S.finishedActivity || S.activity;
    var meta = C.ACTIVITY_META[id] || C.ACTIVITY_META.shapes;
    var nextId = null;
    for (var i = 0; i < C.ACTIVITY_ORDER.length; i++) {
      if (!(S.progress.done && S.progress.done[C.ACTIVITY_ORDER[i]])) { nextId = C.ACTIVITY_ORDER[i]; break; }
    }
    return '' +
      '<div class="wrap stack">' +
        '<section class="card">' +
          '<div class="done-hero">' +
            '<svg viewBox="0 0 100 100" width="96" height="96" aria-hidden="true" focusable="false">' +
              '<circle cx="50" cy="50" r="42" fill="#146B3A"/>' +
              '<path d="M28 52 L44 68 L72 34" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
            '<div style="flex:1 1 260px">' +
              '<h1 id="activity-done-heading">Activity "' + esc(meta.title) + '" is finished</h1>' +
              '<p>You did it. You can do this activity again — the tasks are the same, but in a different order.</p>' +
              '<p class="foot-note">Next practice away from the screen: ' + esc(meta.suggest) + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="btn-row" style="margin-top:18px">' +
            (nextId
              ? '<button class="btn btn-leaf" data-action="open-activity" data-activity="' + nextId + '" data-focus-key="next-activity">Next activity: ' + esc(C.ACTIVITY_META[nextId].title) + '</button>'
              : '<button class="btn btn-leaf" data-action="goto-done" data-focus-key="to-summary">Summary</button>') +
            '<button class="btn btn-plain" data-action="open-activity" data-activity="' + id + '" data-reset="1">Do it again</button>' +
            '<button class="btn btn-plain" data-action="goto-home">All activities</button>' +
          '</div>' +
        '</section>' +
        footer() +
      '</div>';
  }

  function screenDone() {
    var total = C.ACTIVITY_ORDER.length;
    var done = C.completedCount(S.progress);
    var list = C.ACTIVITY_ORDER.map(function (id) {
      var ok = !!(S.progress.done && S.progress.done[id]);
      return '<li><span class="done-tick' + (ok ? '' : ' is-off') + '" aria-hidden="true">' + (ok ? '✓' : '·') + '</span>' +
        '<span>' + esc(C.ACTIVITY_META[id].title) + ' — ' + (ok ? 'done' : 'you can try another time') + '</span></li>';
    }).join('');
    return '' +
      '<div class="wrap stack">' +
        '<section class="card">' +
          '<div class="done-hero">' +
            '<svg viewBox="0 0 120 120" width="110" height="110" aria-hidden="true" focusable="false">' +
              '<circle cx="60" cy="64" r="40" fill="#A87D00" opacity=".22"/>' +
              '<circle cx="60" cy="64" r="28" fill="#146B3A"/>' +
              '<path d="M44 64 L56 76 L78 50" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
            '<div style="flex:1 1 300px">' +
              '<h1 id="done-heading">Activity finished</h1>' +
              '<p>Done ' + done + ' of ' + total + '. This is not a mark, just a note that it has already been tried. You can close the page and come back later — progress is saved in this browser.</p>' +
            '</div>' +
          '</div>' +
          '<h2>What we did</h2>' +
          '<ul class="done-list">' + list + '</ul>' +
          '<h2 style="margin-top:18px">Next practice</h2>' +
          '<p>' + esc(C.nextPractice(S.progress)) + '</p>' +
          '<div class="btn-row" style="margin-top:16px">' +
            '<button class="btn btn-leaf" data-action="goto-home" data-focus-key="back-home">Back to the activities</button>' +
            '<button class="btn btn-plain" data-action="open-activity" data-activity="counting" data-reset="1">Count again</button>' +
            '<button class="btn btn-plain" data-action="open-activity" data-activity="shapes" data-reset="1">Shapes again</button>' +
            '<button class="btn btn-plain" data-action="toggle-grownup">For grown-ups</button>' +
            '<button class="btn btn-plain" data-action="reset-progress" data-focus-key="reset-progress">Reset progress</button>' +
          '</div>' +
        '</section>' +
        footer() +
      '</div>';
  }

  /* -------------------------------------------------------------- grown-ups --- */
  function grownupPanel() {
    if (!S.grownupOpen) { return ''; }
    return '' +
      '<section class="grownup no-print" aria-labelledby="grownup-heading">' +
        '<h2 id="grownup-heading">For grown-ups</h2>' +
        '<p>The activity is meant to take 4–6 minutes: three activities of 1–3 minutes each. Stopping earlier is fine — nothing is "failed".</p>' +
        '<div class="facts">' +
          '<div class="fact"><h3>Fewer choices</h3>' +
            '<p>If choosing from three is still hard for the child, switch on the mode with two choices and two meadows — the tasks stay the same.</p>' +
            '<button class="btn btn-plain" data-action="toggle-fewer" data-focus-key="fewer" aria-pressed="' + (S.fewerChoices ? 'true' : 'false') + '">' +
              (S.fewerChoices ? 'Bring back three choices' : 'Keep two choices') + '</button>' +
          '</div>' +
          '<div class="fact"><h3>Sound and speech</h3>' +
            '<p>Sound is off until a grown-up turns it on with the button at the top. The browser voice may be unavailable — the activity then runs silently, and everything important is written on the screen.</p>' +
          '</div>' +
          '<div class="fact"><h3>What is saved</h3>' +
            '<p>' + (storage.ok
              ? 'This browser saves only the notes that an activity was finished and the chosen number of toys. No names, no analytics, no network requests.'
              : 'Saving in the browser is not available, so the notes last only until the page is closed.') + '</p>' +
            '<button class="btn btn-plain" data-action="reset-progress">Reset progress</button>' +
          '</div>' +
          '<div class="fact"><h3>Accessibility</h3>' +
            '<ul>' +
              '<li>Every shape and button has a number and a written name, so the tasks do not depend on colour vision.</li>' +
              '<li>Everything works from the keyboard: Tab, Enter, space and the arrow keys inside a group. The focus is always visible.</li>' +
              '<li>Animation respects the system "reduce motion" setting.</li>' +
              '<li>No flashing, no timers and no automatic sound.</li>' +
            '</ul>' +
          '</div>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:16px">' +
          '<button class="btn btn-plain" data-action="goto-start">Start</button>' +
          '<button class="btn btn-plain" data-action="goto-home">To the activities</button>' +
          '<button class="btn btn-plain" data-action="toggle-grownup">Close</button>' +
        '</div>' +
      '</section>';
  }

  /* -------------------------------------------------------------- rendering --- */
  function render() {
    var body;
    if (S.screen === 'start') { body = screenStart(); }
    else if (S.screen === 'home') { body = screenHome(); }
    else if (S.screen === 'activity' && S.activity === 'shapes') { body = screenShapes(); }
    else if (S.screen === 'activity' && S.activity === 'sorting') { body = screenSorting(); }
    else if (S.screen === 'activity' && S.activity === 'counting') { body = screenCounting(); }
    else if (S.screen === 'activity-done') { body = screenActivityDone(); }
    else if (S.screen === 'done') { body = screenDone(); }
    else { body = screenHome(); }

    var prev = document.activeElement;
    var prevKey = prev && prev.getAttribute ? prev.getAttribute('data-focus-key') : null;
    var prevId = prev && prev.id ? prev.id : null;

    app.innerHTML = '' +
      '<a class="skip-link no-print" href="#main-content">Skip to the activity</a>' +
      topbar() +
      '<main id="main-content" class="' + (S.textSize === 'large' ? 'text-large' : '') + '">' + body + '</main>' +
      grownupPanel();

    G.updateStorageNote();
    applyTextSize();
    restoreFocus(prevKey, prevId);
  }

  function applyTextSize() {
    document.documentElement.style.fontSize = S.textSize === 'large' ? '21.5px' : '';
  }

  /* Focus restoration: explicit target → previous element → a sensible neighbour. */
  function restoreFocus(prevKey, prevId) {
    var target = null;
    if (S.focusTarget) {
      target = el(S.focusTarget);
    }
    S.focusTarget = null;
    if (!target && prevId) { target = el(prevId); }
    if (!target && prevKey) { target = app.querySelector('[data-focus-key="' + prevKey + '"]'); }
    if (!target) { target = app.querySelector('[data-focus-key]'); }

    /* Inside the meadows and the number rows the group itself takes priority. */
    var groupFocus = app.querySelector('.num-row') || null;
    if (target && !isUsable(target) && groupFocus) { target = groupFocus; }
    if (!target || !isUsable(target)) { return; }
    try { target.focus({ preventScroll: true }); } catch (e) { try { target.focus(); } catch (e2) {} }
  }

  function isUsable(node) {
    return !!(node && node.isConnected && !node.disabled && node.getClientRects && node.getClientRects().length > 0);
  }

  /* The contract with the state layer (the first script block): it calls
     render() by name, and this block puts its own implementation here. */
  G.render = render;

  /* --------------------------------------------------------------- actions --- */
  document.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('[data-action]') : null;
    if (!btn) { return; }
    var action = btn.getAttribute('data-action');
    var ariaOff = btn.getAttribute('aria-disabled') === 'true';

    switch (action) {
      case 'begin':
        G.go('#activity-1');
        break;
      case 'goto-start':
        G.go('#start');
        break;
      case 'goto-home':
        G.go('#home');
        break;
      case 'goto-done':
        G.go('#done');
        break;
      case 'toggle-sound':
        var wasOn = Sound.isEnabled();
        S.soundOn = Sound.setEnabled(!wasOn);
        if (S.soundOn) { Sound.play('step'); } else { Sound.stopSpeaking(); }
        render();
        announce(S.soundOn
          ? 'Sound is on. The activity speaks out loud and repeats everything important in words on the screen.'
          : 'Sound is off. The whole activity works without sound.');
        break;
      case 'toggle-grownup':
        S.grownupOpen = !S.grownupOpen;
        render();
        break;
      case 'text-size':
        S.textSize = S.textSize === 'large' ? 'normal' : 'large';
        render();
        break;
      case 'toggle-fewer':
        S.fewerChoices = !S.fewerChoices;
        if (S.activity === 'shapes') { S.shapeRound = 0; G.initShapeActivity({}); }
        if (S.activity === 'sorting') { S.sortRound = 0; G.initSortActivity({}); }
        if (S.activity === 'counting') { S.countRound = 0; G.initCountActivity({}); }
        render();
        announce(S.fewerChoices
          ? 'Two-choice mode is on. The same tasks, with fewer choices.'
          : 'Three choices again.');
        break;
      case 'open-activity':
        openActivityByButton(btn);
        break;
      case 'open-next':
        var nextId = null;
        for (var i = 0; i < C.ACTIVITY_ORDER.length; i++) {
          if (!(S.progress.done && S.progress.done[C.ACTIVITY_ORDER[i]])) { nextId = C.ACTIVITY_ORDER[i]; break; }
        }
        G.go('#activity-' + (C.ACTIVITY_ORDER.indexOf(nextId || C.ACTIVITY_ORDER[0]) + 1));
        break;
      case 'demo':
        if (S.activity === 'shapes') { G.playShapeDemo(); }
        else if (S.activity === 'sorting') { G.playSortDemo(); }
        else if (S.activity === 'counting') { G.initCountActivity({ playDemo: true }); render(); }
        break;
      case 'hint':
        if (S.activity === 'shapes') { G.showShapeHint(); }
        else if (S.activity === 'sorting') { showSortHint(); }
        else if (S.activity === 'counting') { showCountHint(); }
        break;
      case 'restart-activity':
        if (S.activity === 'shapes') { S.shapeRound = 0; G.openActivity('shapes', { reset: true, focus: true }); }
        else if (S.activity === 'sorting') { S.sortRound = 0; G.openActivity('sorting', { reset: true, focus: true }); }
        else if (S.activity === 'counting') { S.countRound = 0; G.openActivity('counting', { reset: true, focus: true }); }
        break;
      case 'answer-shape':
        G.answerShape(parseInt(btn.getAttribute('data-index'), 10));
        break;
      case 'select-piece':
        G.selectPiece(btn.getAttribute('data-item'));
        break;
      case 'drop':
        G.dropInto(btn.getAttribute('data-group'));
        break;
      case 'count-tap':
        if (ariaOff) { announce('All the toys are counted. Pick the number under the shelf.'); }
        else { G.countTap(); }
        break;
      case 'count-reset':
        G.resetCounting();
        break;
      case 'set-count':
        setCount(parseInt(btn.getAttribute('data-count'), 10));
        break;
      case 'answer-count':
        if (ariaOff) { announce('First count the toys: tap the arrow button.'); }
        else { G.answerCount(parseInt(btn.getAttribute('data-number'), 10)); }
        break;
      case 'reset-progress':
        doResetProgress();
        break;
    }
  });

  function openActivityByButton(btn) {
    var aid = btn.getAttribute('data-activity');
    var reset = btn.getAttribute('data-reset') === '1';
    var hash = '#activity-' + (C.ACTIVITY_ORDER.indexOf(aid) + 1);
    if (reset) {
      if (aid === 'shapes') { S.shapeRound = 0; }
      if (aid === 'sorting') { S.sortRound = 0; }
      if (aid === 'counting') { S.countRound = 0; }
      G.openActivity(aid, { reset: true, focus: true, silent: false });
      if (window.location.hash !== hash) {
        try { window.history.replaceState(null, '', hash); } catch (e) { window.location.hash = hash; }
      }
    } else {
      G.go(hash);
    }
  }

  /* The keyboard: arrow keys inside the groups of choices, meadows and
     numbers. Enter and space work normally because every element is a <button>. */
  document.addEventListener('keydown', function (ev) {
    if (!ev.target || !ev.target.closest) { return; }
    var group = ev.target.closest('[role="group"]');
    if (!group) { return; }
    var key = ev.key;
    if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp', 'Home', 'End'].indexOf(key) === -1) { return; }
    var items = Array.prototype.slice.call(group.querySelectorAll('button:not([aria-disabled="true"])'));
    var idx = items.indexOf(ev.target);
    if (idx === -1) { return; }
    ev.preventDefault();
    var nextIdx = idx;
    if (key === 'ArrowRight' || key === 'ArrowDown') { nextIdx = (idx + 1) % items.length; }
    if (key === 'ArrowLeft' || key === 'ArrowUp') { nextIdx = (idx - 1 + items.length) % items.length; }
    if (key === 'Home') { nextIdx = 0; }
    if (key === 'End') { nextIdx = items.length - 1; }
    items[nextIdx].focus();
  });

  /* ---------------------------------------------------------- announcements --- */
  function announce(text) {
    var box = el('polite-news');
    if (!box) { return; }
    box.textContent = '';
    window.setTimeout(function () { box.textContent = text; }, 30);
  }

  function showSortHint() {
    var rounds = G.activeSortRoundsValue();
    var round = rounds[S.sortRound];
    if (!round || !S.sortState) { return; }
    var item = C.firstRemaining(S.sortState);
    var text;
    if (!item) {
      text = 'All the shapes are already sorted.';
    } else if (round.mode === 'shape') {
      text = 'Hint: this shape has ' + C.SHAPE_HINTS[item.shape] + ' — so its meadow is "' + C.expectedGroupLabel(round, item) + '".';
    } else {
      var c = C.colorOf(item.color);
      text = 'Hint: this shape is ' + c.label + ' and ' + C.shapeOf(item.shape).label + ' — its meadow is "' +
        C.expectedGroupLabel(round, item) + '».';
    }
    S.sortFeedback = { kind: 'care', text: text, sub: 'You can tap the meadow the hint points to — you can try as many times as you like.' };
    Sound.play('hint');
    Sound.say(text);
    G.setAnnounce(text, 'focus');
    render();
  }

  function showCountHint() {
    if (!S.countState) { return; }
    var complete = C.isCountComplete(S.countState);
    var text = complete
      ? 'All the toys are counted. There are ' + S.countState.sequence.length + '. Tap the number ' + S.countState.sequence.length + '.'
      : 'We count one at a time: tap the arrow button, this will be ' + Math.min(S.countState.count + 1, S.countState.sequence.length) + '.';
    S.countFeedback = { kind: 'care', text: text, sub: 'You can count as many times as you like.' };
    Sound.play('hint');
    Sound.say(text);
    G.setAnnounce(text, 'focus');
    render();
  }

  function setCount(n) {
    if (!S.countState) { return; }
    S.countState = C.createCountState(C.clampCount(n));
    S.countAnswerNeeded = false;
    S.countFeedback = {
      kind: 'idle',
      text: 'We made a collection of ' + S.countState.sequence.length + '. Now let us count it one by one.'
    };
    Sound.play('step');
    G.setAnnounce(S.countFeedback.text, 'focus');
    render();
  }

  function doResetProgress() {
    storage.clear();
    S.progress = C.createProgress();
    S.grownupOpen = false;
    Sound.stopSpeaking();
    G.showStart({ focus: true });
    announce('Progress has been reset. The activity starts from a clean page.');
  }

  /* -------------------------------------------------------------------- boot --- */
  (function boot() {
    var live = document.createElement('div');
    live.id = 'polite-news';
    live.className = 'sr-only';
    live.setAttribute('role', 'status');
    live.setAttribute('aria-live', 'polite');
    document.body.appendChild(live);

    /* All the screens are defined above, so the load can be started. */
    G.bootFromHash();
  }());
}());
</script>
</body>
</html>
